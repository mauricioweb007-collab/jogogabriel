<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- Todos os caminhos relativos partem da raiz do projeto (jogo de Ciências congelado, sem alterações). -->
  <base href="../../../">
  <title>Replay — Ciências</title>
  <meta name="description" content="Replay recreativo de um minijogo de Ciências (Gabriel Nexus).">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="src/franchise/franchise.css">
  <script>window.__CIENCIAS_KEY = 'ecoNexus.replay.ciencias.v1';</script>
  <script src="src/modules/ciencias-legacy-adapter/shim.js"></script>
  <script src="src/franchise/config.js"></script>
  <script src="src/franchise/sha256.js"></script>
  <script src="src/franchise/store.js"></script>
  <script src="src/franchise/parent-auth.js"></script>
  <script src="src/franchise/replay.js"></script>
  <script></script>
</head>
<body>
  <!-- Mundo 2D (Canvas) -->
  <canvas id="world" aria-label="Mundo do jogo"></canvas>

  <!-- HUD discreto: missão, moedas, nível, botões -->
  <div id="hud">
    <div class="hud-left">
      <canvas id="hAvatar" width="56" height="56" aria-hidden="true"></canvas>
      <div class="hud-id">
        <b id="hName">Gabriel</b>
        <span id="hTitle">Nv 1</span>
        <span id="hLeaves" class="hud-leaves" title="Folhas de energia: cada desafio começa com 3">🍃🍃🍃</span>
        <div class="xpbar" title="Experiência (XP)"><i id="hXp"></i><span id="hXpT"></span></div>
      </div>
      <div class="coins" title="EcoMoedas">🪙 <b id="hCoins">0</b></div>
    </div>
    <button id="hMission" class="mission" type="button" title="Abrir o Mural de Missões"><span class="lbl">🎯 Missão</span><span id="hMissionT"></span></button>
    <div id="hFrag" class="frag-tracker"></div>
    <div class="hud-btns">
      <button id="hMenu" type="button" title="Menu (Esc)" aria-label="Menu">☰</button>
      <button id="hInv" type="button" title="Inventário (I)" aria-label="Inventário">🎒</button>
      <button id="hNote" type="button" title="Caderno do Guardião (C)" aria-label="Caderno do Guardião">📓</button>
      <button id="hPath" type="button" title="Mostrar caminho (M)" aria-label="Mostrar caminho">🧭</button>
      <button id="hSound" type="button" title="Ligar sons" aria-label="Som">🔇</button>
      <button id="hFull" type="button" title="Tela cheia" aria-label="Tela cheia">⛶</button>
      <button id="hMin" type="button" title="Recolher/expandir HUD" aria-label="Recolher HUD">▾</button>
    </div>
  </div>
  <div id="saveBadge">💾 Salvo</div>

  <!-- Controles de toque -->
  <div id="touch">
    <div id="joy" aria-label="Direcional"><div id="joyKnob"></div></div>
    <button id="btnAct" type="button" aria-label="Interagir">✋</button>
  </div>

  <!-- Camadas de interface -->
  <div id="layer"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Tela inicial -->
  <div id="title" class="hide">
    <div class="title-bg"><span>🌳</span><span>💧</span><span>☀️</span><span>🦜</span><span>🌵</span><span>🐟</span><span>🍄</span><span>🌾</span></div>
    <div class="title-card">
      <div class="logo">💎</div>
      <h1>Missão EcoNexus</h1>
      <h2>Guardiões dos Biomas</h2>
      <p class="tag">Uma aventura de Ciências para o 4º ano</p>
      <div id="titleBtns"></div>
      <p class="tiny">Funciona sem internet. O progresso fica salvo só neste aparelho.</p>
    </div>
  </div>
  <script src="js/core/util.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/sprites.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/data/glossary.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/lessons.js"></script>
  <script src="js/data/mapkit.js"></script>
  <script src="js/data/maps.js"></script>
  <script src="js/systems/save.js"></script>
  <script src="js/systems/economy.js"></script>
  <script src="js/systems/quests.js"></script>
  <script src="js/systems/learning.js"></script>
  <script src="js/systems/minigames.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
/* REPLAY RECREATIVO (Fliperama do Gabriel Nexus): abre só o minijogo pedido, com save temporário.
   O resultado vai para a caixa do Nexus (GG.replay) e NÃO vale pontos de estudo. */
(function () {
  var P = GG.replay.params(), ids = ['trilha_segura', 'corredor_cadeia', 'coleta_solar', 'salve_lago', 'torre_niveis', 'corrida_biomas', 'relampago'];
  var mg = ids.indexOf(P.mg) >= 0 ? P.mg : null, token = /^[a-z0-9-]{4,80}$/i.test(P.token || '') ? P.token : null;
  var best = -1;
  EN.game.boot = function () {
    EN.ui.init(); EN.engine.G = EN.game; EN.engine.init(document.getElementById('world'));
    document.getElementById('hud').style.display = 'none'; document.getElementById('touch').style.display = 'none';
    EN.save.S = EN.save.fresh('Gabriel'); EN.save.S.introDone = true;
    if (GG.testMode.active()) GG.testMode.banner('');
    if (!mg) { alert('Minijogo inválido.'); GG.replay.back(''); return; }
    var orig = EN.eco.minigameReward;
    EN.eco.minigameReward = function (id, score) {
      var s = Math.round(Math.max(0, Math.min(1, Number(score) || 0)) * 100);
      if (token && s > best) { best = s; GG.replay.push('ciencias_' + mg, s, token); }
      return orig.apply(this, arguments);
    };
    Promise.resolve(EN.minigames.play(mg)).then(function () { GG.replay.back(''); });
  };
})();
</script>
</body>
</html>
