<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f4d">
  <meta name="description" content="Gabriel Nexus — O Mundo dos Nexóticos: o jogo central da franquia, onde os pontos de estudo viram coleção, base e diversão.">
  <title>Gabriel Nexus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.5' stop-color='%2329e7ff'/%3E%3Cstop offset='1' stop-color='%236a3cff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M20 44V20l24 24V20' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/shared/fonts/fonts.css">
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="../franchise/franchise.css">
  <link rel="stylesheet" href="nexus.css">
</head>
<body class="nexus">
  <div id="nxLoading" class="nx-loading"><div class="nx-spin" aria-hidden="true"></div><p>Acordando o Nexus…</p></div>

  <!-- HUD fixo -->
  <header id="nxHud" class="nx-hud hide">
    <button type="button" id="nxBack" class="nx-back hide" aria-label="Voltar para a Praça dos Mundos">⬅ <span>Praça</span></button>
    <div class="nx-id">
      <div id="nxAvatar" class="nx-avatar" aria-hidden="true"></div>
      <div class="nx-idt">
        <b id="nxName" class="nx-name">GABRIEL</b>
        <span id="nxTitle" class="nx-title"></span>
        <div class="nx-lv"><span id="nxLvl">Nv 1</span><div class="nx-lvbar" role="progressbar" aria-label="Nível do Nexus"><i id="nxLvBar"></i></div></div>
      </div>
    </div>
    <div class="nx-stats">
      <span class="nx-stat" title="Pontuação de Carreira (nunca diminui)">⭐ <b id="nxCareer">0</b><small>carreira</small></span>
      <span class="nx-stat" title="Moedas Nexus (para gastar)"><span class="nx-coin" aria-hidden="true"></span> <b id="nxCoins">0</b><small>moedas</small></span>
      <span class="nx-stat nx-stat-s" title="Fragmentos">🧩 <b id="nxFrags">0</b></span>
      <span class="nx-stat nx-stat-s" title="Cristais de Decoração">💎 <b id="nxMats">0</b></span>
    </div>
    <nav class="nx-hbtns">
      <button type="button" id="nxMapBtn" class="icon-btn" title="Mapa rápido (M)" aria-label="Mapa rápido">🗺️</button>
      <button type="button" id="nxTeamBtn" class="icon-btn" title="Minha equipe (T)" aria-label="Minha equipe">🧸</button>
      <button type="button" id="nxSetBtn" class="icon-btn" title="Configurações" aria-label="Configurações">⚙️</button>
      <button type="button" id="nxExitBtn" class="icon-btn" title="Voltar à Central de Missões" aria-label="Sair do Nexus">🚪</button>
    </nav>
  </header>

  <!-- Hub: Praça dos Mundos (2.5D) -->
  <main id="nxHub" class="nx-hub hide" aria-label="Praça dos Mundos">
    <div id="nxStage" class="nx-stage">
      <img id="nxHubImg" class="nx-stage-img" src="assets/cenarios/02_cenario_praca_dos_mundos.jpg" alt="Praça dos Mundos: ilhas flutuantes com portais para os mundos das matérias e uma fonte de cristal no centro." draggable="false">
      <div id="nxSpots" class="nx-spots"></div>
      <div id="nxActors" class="nx-actors" aria-hidden="true"></div>
    </div>
    <canvas id="nxFx" class="nx-fx" aria-hidden="true"></canvas>
    <div id="nxWeatherTint" class="nx-tint" aria-hidden="true"></div>
    <div id="nxHubTools" class="nx-hubtools"></div>
    <nav id="nxDock" class="nx-dock" aria-label="Áreas do Nexus"></nav>
  </main>

  <!-- Áreas -->
  <section id="nxArea" class="nx-area hide" aria-live="polite">
    <img id="nxAreaBg" class="nx-area-bg" alt="" aria-hidden="true">
    <div id="nxAreaBody" class="nx-area-body"></div>
  </section>

  <!-- Jogos recreativos do Nexus -->
  <section id="nxGame" class="nx-game hide" aria-label="Minigame">
    <canvas id="nxGameCv" class="nx-game-cv"></canvas>
    <div id="nxGameHud" class="nx-game-hud"></div>
    <div id="nxGamePad" class="nx-game-pad"></div>
  </section>

  <div id="nxCaption" class="nx-caption" role="status" aria-live="polite"></div>
  <noscript><p style="padding:20px;font:18px sans-serif">Este jogo precisa de JavaScript ativado no navegador.</p></noscript>

  <script src="../core/util.js"></script>
  <script src="../core/storage.js"></script>
  <script src="../core/input.js"></script>
  <script src="../core/audio.js"></script>
  <script src="../ui/ui.js"></script>
  <script src="../franchise/config.js"></script>
  <script src="../franchise/sha256.js"></script>
  <script src="../franchise/store.js"></script>
  <script src="../franchise/parent-auth.js"></script>
  <script src="../franchise/profile.js"></script>
  <script src="../franchise/catalog.js"></script>
  <script src="../franchise/modules.js"></script>
  <script src="../franchise/bridge.js"></script>
  <script src="../franchise/replay.js"></script>
  <script src="../modules/registry.js"></script>
  <script src="../modules/modulos.js"></script>
  <script src="data/itens.js"></script>
  <script src="economy.js"></script>
  <script src="core.js"></script>
  <script src="hub.js"></script>
  <script src="areas.js"></script>
  <script src="games.js"></script>
  <script src="arcade.js"></script>
  <script src="main.js"></script>
</body>
</html>
