<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b38">
  <meta name="description" content="Central de missões de estudo do Gabriel: escolha a matéria (Ciências, Geografia…) ou entre no Gabriel Nexus.">
  <title>Central de Missões</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='8' fill='%23ffd23f' stroke='%2315152a' stroke-width='4'/%3E%3Cpath d='M20 32h24M32 20v24' stroke='%2315152a' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/assets/shared/fonts/fonts.css">
  <link rel="stylesheet" href="src/ui/ui.css">
  <link rel="stylesheet" href="src/franchise/franchise.css">
  <link rel="stylesheet" href="src/launcher/launcher.css">
</head>
<body class="launcher">
  <!-- Tela de entrada: só o nome (sem senha, sem cadastro) -->
  <section id="login" class="lg hide" aria-label="Entrada">
    <img class="lg-bg" src="src/nexus/assets/cenarios/06_cenario_login.jpg" alt="" aria-hidden="true">
    <div class="lg-logo"><img src="src/assets/shared/kodomo/logo_colegio_kodomo.png" alt="Colégio Kodomo"></div>
    <form id="lgForm" class="lg-card" autocomplete="off" novalidate>
      <p class="lg-kicker">Gabriel Nexus</p>
      <h1 class="lg-title">Qual é o seu nome?</h1>
      <label class="sr" for="lgName">Seu nome</label>
      <input id="lgName" name="nome" type="text" maxlength="30" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Digite seu nome" required>
      <p id="lgPreview" class="lg-preview" aria-live="polite"></p>
      <button type="submit" class="btn pri lg-go">Entrar ▶</button>
      <p class="lg-tip">Sem senha. Seu progresso fica salvo neste computador.</p>
    </form>
    <button type="button" class="lg-parents" id="lgParents">Área dos Pais</button>
  </section>

  <main class="ln-wrap hide" id="launcherMain">
    <header class="ln-head">
      <canvas id="lnGaia" width="48" height="48" aria-hidden="true"></canvas>
      <div class="ln-head-t">
        <p class="ln-hello" id="lnHello">Olá!</p>
        <h1 class="pix">Qual missão você quer jogar?</h1>
      </div>
      <button type="button" class="btn small ghost" id="lnName" title="Trocar o nome exibido">✏️ Nome</button>
    </header>
    <section id="lnNexus" class="ln-nexus" aria-label="Gabriel Nexus"></section>
    <section id="lnCards" class="ln-cards" aria-label="Missões disponíveis"></section>
    <footer class="ln-foot">
      <p>Cada matéria é uma missão independente, com progresso, moedas e itens próprios, salvos só neste aparelho. Os pontos de estudo também viram Moedas Nexus.</p>
      <button type="button" class="btn small ghost" id="lnCredits">Créditos e licenças</button>
      <button type="button" class="btn small ghost ln-parents" id="lnParents">Área dos Pais</button>
    </footer>
  </main>
  <noscript><p style="padding:20px;font:18px sans-serif">Este jogo precisa de JavaScript ativado no navegador.</p></noscript>
  <script src="src/core/util.js"></script>
  <script src="src/core/storage.js"></script>
  <script src="src/core/input.js"></script>
  <script src="src/core/audio.js"></script>
  <script src="src/core/pixel.js"></script>
  <script src="src/ui/ui.js"></script>
  <script src="src/assets/shared/brasil-mapa.js"></script>
  <script src="src/ui/maps.js"></script>
  <script src="src/franchise/config.js"></script>
  <script src="src/franchise/sha256.js"></script>
  <script src="src/franchise/store.js"></script>
  <script src="src/franchise/parent-auth.js"></script>
  <script src="src/franchise/profile.js"></script>
  <script src="src/franchise/catalog.js"></script>
  <script src="src/franchise/modules.js"></script>
  <script src="src/franchise/bridge.js"></script>
  <script src="src/modules/registry.js"></script>
  <script src="src/modules/modulos.js"></script>
  <script src="src/launcher/launcher.js"></script>
</body>
</html>
